# Commit messages follow Conventional Commits. https://www.conventionalcommits.org/
style = "conventional"
subject_length = 72
line_length = 0
subject_capitalized = false
subject_not_punctuated = true
imperative_subject = true
no_fixup = false
no_wip = true
allowed_types = [
  "build",
  "chore",
  "ci",
  "docs",
  "feat",
  "fix",
  "perf",
  "refactor",
  "revert",
  "style",
  "test",
]
