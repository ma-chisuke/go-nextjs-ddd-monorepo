# Trivy settings shared by every scan. https://trivy.dev/latest/docs/references/configuration/config-file/
severity:
  - MEDIUM
  - HIGH
  - CRITICAL

# This template is distributed under MIT-0. A dependency under a strong
# copyleft or a source-available license must not become part of a product
# built from it, so the license scan fails on the licenses in `forbidden`
# (Trivy rates them CRITICAL, and `make scan-deps` fails on CRITICAL only).
# Weak copyleft (LGPL, MPL) is allowed: it covers the library itself, not the
# code that uses it.
#
# A license must be in one list only. Trivy's default `restricted` list holds
# the GPL family; with GPL in both lists, Trivy picked one of the two at
# random, and the scan missed a GPL dependency in one run out of five. So
# `restricted` is spelled out here without the licenses that are forbidden.
license:
  full: false
  forbidden:
    - AGPL-1.0
    - AGPL-3.0
    - GPL-1.0
    - GPL-2.0
    - GPL-3.0
    - OSL-1.0
    - OSL-1.1
    - OSL-2.0
    - OSL-2.1
    - OSL-3.0
    - QPL-1.0
    - Sleepycat
    - SSPL-1.0
    - BUSL-1.1
    - CC-BY-NC-1.0
    - CC-BY-NC-2.0
    - CC-BY-NC-2.5
    - CC-BY-NC-3.0
    - CC-BY-NC-4.0
    - CC-BY-NC-ND-4.0
    - CC-BY-NC-SA-4.0
    - Commons-Clause
  restricted:
    - LGPL-2.0
    - LGPL-2.1
    - LGPL-3.0
    - GPL-2.0-with-classpath-exception
    - GPL-2.0-with-GCC-exception
    - GPL-3.0-with-GCC-exception
    - CC-BY-ND-4.0
    - CC-BY-SA-4.0
    - NPL-1.0
    - NPL-1.1
