# The local environment: everything runs with Docker Compose alone, without
# an AWS account (TPL-0017).
#
#   make up         start PostgreSQL and bring every schema up to date, start
#                   AWS Emulator and create the event bus and the queues in
#                   it, then build and start Mailpit, the services of every
#                   context, and the frontend (http://127.0.0.1:13000)
#   make down       stop everything; the data of PostgreSQL stays
#   make db-up      start PostgreSQL and bring every schema up to date
#   make db-down    stop it and delete its data
#
# Start the system with `make up`, not with `docker compose up` alone: pgschema
# and Terraform from mise.toml apply the schemas and the AWS resources from
# the host (tools/scripts/db.sh, tools/scripts/aws.sh), and the services
# expect them in place.
name: go-nextjs-ddd-monorepo

# What every service of the product shares: the services of the bounded
# contexts, each built from backend/Dockerfile with the build argument CONTEXT
# naming its command, and the frontend, built from frontend/Dockerfile. Each
# one checks its own health with the HEALTHCHECK of its image.
x-context-service: &context-service
  pull_policy: build
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

# What points a service at AWS Emulator instead of AWS (package awsconfig).
# The service mounts the volume aws-emulator at /aws-emulator for the CA. The
# certificate of the emulator carries the name localhost, and the services
# reach it as `aws`, so they are told which name to expect. Requests are not
# signed; the credentials are placeholders that the SDK needs to sign at all.
x-aws-emulator: &aws-emulator
  AWS_REGION: us-east-1
  AWS_ENDPOINT_URL: https://aws:9297
  AWS_CA_BUNDLE: /aws-emulator/9297/ca.pem
  AWS_ENDPOINT_SERVER_NAME: localhost
  AWS_ACCESS_KEY_ID: emulator
  AWS_SECRET_ACCESS_KEY: emulator

services:
  postgres:
    image: postgres:18.7@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
    environment:
      POSTGRES_DB: app
      # Local only; see db/local.sql.
      POSTGRES_PASSWORD: postgres
    ports:
      # Loopback only. 5432 is often taken by another PostgreSQL.
      #
      # Every port that this file publishes lies below 32768. From there up,
      # Linux and macOS hand out ports by themselves, to outgoing connections
      # too: a test that holds a connection to this PostgreSQL can sit on the
      # very port that a service is about to publish, and the service then
      # fails to start with "address already in use".
      - 127.0.0.1:${POSTGRES_PORT:-15432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./db/bootstrap.sql:/docker-entrypoint-initdb.d/10-bootstrap.sql:ro
      - ./db/local.sql:/docker-entrypoint-initdb.d/20-local.sql:ro
    healthcheck:
      # Over TCP: the socket also answers while the image still runs the
      # bootstrap on its temporary server.
      test: [CMD-SHELL, pg_isready --host 127.0.0.1 --username postgres --dbname app]
      interval: 2s
      timeout: 2s
      retries: 30

  # AWS Emulator: EventBridge, SQS, and the other AWS services that the
  # contexts use (TPL-0017). It keeps its state in memory, so what a start of
  # the system creates in it is gone with the container. The volume holds the
  # CA of its endpoint, which the emulator makes at every start: the services
  # that call AWS mount it, and tools/scripts/aws.sh copies it to the host.
  aws:
    build:
      context: infra/local/aws-emulator
    image: go-nextjs-ddd-monorepo/aws-emulator:local
    pull_policy: build
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      # Loopback only: the emulator checks no signature.
      - 127.0.0.1:${AWS_PORT:-19297}:9297
    volumes:
      - aws-emulator:/home/emulator/.aws/emulator

  # The services connect as the runtime role of their context, whose password
  # is public on purpose (db/local.sql), and listen on the loopback address only.
  facility:
    <<: *context-service
    build:
      context: backend
      args:
        CONTEXT: facility
    image: go-nextjs-ddd-monorepo/facility:local
    environment:
      DATABASE_URL: postgres://facility_runtime:facility_runtime@postgres:5432/app?sslmode=disable
    ports:
      - 127.0.0.1:${FACILITY_PORT:-18081}:8080
    depends_on:
      postgres:
        condition: service_healthy

  reservation:
    <<: *context-service
    build:
      context: backend
      args:
        CONTEXT: reservation
    image: go-nextjs-ddd-monorepo/reservation:local
    environment:
      DATABASE_URL: postgres://reservation_runtime:reservation_runtime@postgres:5432/app?sslmode=disable
      # Facility through the network of Compose, as another context would reach
      # it through the private network in AWS (TPL-0014).
      FACILITY_API_URL: http://facility:8080
    ports:
      - 127.0.0.1:${RESERVATION_PORT:-18082}:8080
    depends_on:
      postgres:
        condition: service_healthy
      facility:
        condition: service_healthy

  # The relay of the outbox of Reservation: the image of the API with another
  # command, as a second ECS service runs it in AWS (TPL-0014). It publishes
  # the events to the bus that `make up` creates in the emulator, and refuses
  # to start without that bus.
  reservation-relay:
    <<: *context-service
    build:
      context: backend
      args:
        CONTEXT: reservation
    image: go-nextjs-ddd-monorepo/reservation:local
    command: [relay]
    environment:
      <<: *aws-emulator
      DATABASE_URL: postgres://reservation_runtime:reservation_runtime@postgres:5432/app?sslmode=disable
      EVENT_BUS_NAME: contexts
    volumes:
      - aws-emulator:/aws-emulator:ro
    depends_on:
      postgres:
        condition: service_healthy
      aws:
        condition: service_healthy

  # The worker of Notification: it reads the queue that `make up` creates in
  # the emulator, and sends its mail to Mailpit.
  notification:
    <<: *context-service
    build:
      context: backend
      args:
        CONTEXT: notification
    image: go-nextjs-ddd-monorepo/notification:local
    environment:
      <<: *aws-emulator
      DATABASE_URL: postgres://notification_runtime:notification_runtime@postgres:5432/app?sslmode=disable
      # The emulator names its queues as AWS does, and answers for that name
      # on its own endpoint. 000000000000 is its account.
      EVENTS_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/000000000000/notification-events
      SMTP_ADDR: mailpit:1025
      MAIL_FROM: Meeting rooms <rooms@example.com>
    volumes:
      - aws-emulator:/aws-emulator:ro
    depends_on:
      postgres:
        condition: service_healthy
      aws:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  # The frontend: the only service that a browser reaches, at
  # http://127.0.0.1:13000. It calls the APIs of the contexts through the
  # network of Compose, as it reaches them through the private network in AWS
  # (TPL-0014).
  web:
    <<: *context-service
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: go-nextjs-ddd-monorepo/web:local
    environment:
      FACILITY_API_URL: http://facility:8080
      RESERVATION_API_URL: http://reservation:8080
    ports:
      # Below the range from which the system hands out ports by itself, so
      # that no other process holds it by chance. 3000 is left to the
      # development server (make frontend-dev).
      - 127.0.0.1:${WEB_PORT:-13000}:3000
    depends_on:
      facility:
        condition: service_healthy
      reservation:
        condition: service_healthy

  # Mailpit catches the mail that Notification sends, and shows it at
  # http://127.0.0.1:18025. No mail leaves the machine, and the mail is gone
  # when the container stops.
  mailpit:
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: 65532:65532
    tmpfs:
      # Mailpit keeps the mail in a temporary database.
      - /tmp
    ports:
      # The web interface and the API, on the loopback address only. SMTP
      # (1025) is for the other containers.
      - 127.0.0.1:${MAILPIT_PORT:-18025}:8025
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  postgres-data:
  aws-emulator:
