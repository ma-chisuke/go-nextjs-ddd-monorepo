# pnpm settings for the whole repository. See docs/adr/template/TPL-0024.
packages:
  - frontend

# Supply chain: wait three days before a new release can be installed, pin exact
# versions, refuse dependencies that are not from the registry, and refuse a
# package whose publisher trust got weaker than in an earlier release.
minimumReleaseAge: 4320
saveExact: true
blockExoticSubdeps: true
trustPolicy: no-downgrade

# Dependency build scripts do not run unless a package is listed in allowBuilds.
strictDepBuilds: true

# Security fixes that a direct dependency has not picked up yet. Remove an
# entry when the dependency itself requires a fixed version.
overrides:
  # textlint 15.8.0 requires glob 13, which has CVE-2026-118773; glob 13 in
  # turn requires minimatch 10, which has CVE-2026-118764.
  glob: 14.0.6
  # typescript-eslint 8.72.2 requires minimatch 10 (CVE-2026-118764); its next
  # release requires a fixed version but is younger than minimumReleaseAge.
  minimatch@10: 11.0.8
  # @stryker-mutator/core 10.1.1 requires typed-rest-client 2.3.1, for its
  # dashboard reporter, which pins qs 6.15.1; qs fixed four advisories by
  # 6.16.1.
  qs: 6.16.2

# eslint-config-next 16 supports ESLint 10 with shims of its own, but three of
# the plugins it bundles still declare ESLint 9 as their newest peer.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-import>eslint: "10"
    eslint-plugin-jsx-a11y>eslint: "10"
    eslint-plugin-react>eslint: "10"
    # openapi-typescript 7 declares TypeScript 5 as its peer. It generates the
    # same types with TypeScript 6, and gen-check-api-ts and the type check of
    # the frontend fail if a later version stops doing so.
    openapi-typescript>typescript: "6"
