# yaml-language-server: $schema=https://spec.openapis.org/oas/3.1/schema/2022-10-07
openapi: 3.1.0
info:
  title: Reservation API
  version: 0.1.0
  summary: Bookings of meeting rooms.
  description: |
    The Reservation context books meeting rooms, reschedules the bookings, and
    cancels them. It asks the Facility API what a room holds and when it is
    open, and it never lets two confirmed reservations of one room overlap.

    Every instant is an RFC 3339 date-time. A period starts at `startsAt` and
    ends just before `endsAt`, so one reservation may end when the next starts.

    A reservation has a version. `ETag` carries it, and every change names the
    version that it read in `If-Match`, so that no change overwrites another
    one unseen.
  license:
    name: MIT No Attribution
    identifier: MIT-0
servers:
  - url: /
    description: The base URL differs by environment, so each client sets it.
# The API is reachable only from the private network and has no
# authentication of its own (TPL-0014).
security: []
tags:
  - name: reservations
    description: Reservations of meeting rooms.
paths:
  /reservations:
    post:
      operationId: bookRoom
      summary: Book a room
      description: |
        Books a room for a period. The period starts and ends on a quarter
        hour, lasts at most 4 hours, does not start in the past, and lies
        inside the opening hours of the room on one day, read in the time zone
        of the room. The attendees fit the capacity of the room, and no other
        confirmed reservation of the room overlaps the period.

        A request that is sent again with the same `Idempotency-Key` and the
        same body answers with the reservation that the first one made, and
        books nothing new.
      tags: [reservations]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewReservation"
      responses:
        "201":
          description: The room was booked, or the request repeats one that booked it.
          headers:
            Location:
              $ref: "#/components/headers/Location"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      operationId: listReservations
      summary: List reservations
      description: |
        Lists reservations, confirmed and cancelled, in the order of their
        start and then of their id, one page at a time. The filters narrow the
        list to one room, and to the reservations whose period overlaps the
        window from `from` to `to`.
      tags: [reservations]
      parameters:
        - name: roomId
          in: query
          description: Only the reservations of this room.
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          description: Only the reservations that end after this instant.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Only the reservations that start before this instant. It is later than `from`.
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of reservations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationPage"
        "400":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /reservations/{reservationId}:
    get:
      operationId: getReservation
      summary: Get a reservation
      description: Returns one reservation, with its version in `ETag`.
      tags: [reservations]
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      responses:
        "200":
          description: The reservation.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: rescheduleReservation
      summary: Reschedule a reservation
      description: |
        Changes the period or the number of attendees of a confirmed
        reservation. A property that the body leaves out keeps its value. The
        changed reservation follows the same rules as a new one. The request
        names the version that it read in `If-Match`.
      tags: [reservations]
      parameters:
        - $ref: "#/components/parameters/ReservationId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationChanges"
      responses:
        "200":
          description: The reservation was rescheduled.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
  /reservations/{reservationId}/cancellation:
    post:
      operationId: cancelReservation
      summary: Cancel a reservation
      description: |
        Cancels a confirmed reservation, at the latest 30 minutes before it
        starts. The room is free for other reservations from then on. The
        request names the version that it read in `If-Match`.
      tags: [reservations]
      parameters:
        - $ref: "#/components/parameters/ReservationId"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: The reservation was cancelled.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
components:
  parameters:
    ReservationId:
      name: reservationId
      in: path
      required: true
      description: The id of a reservation.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A value that the client chooses once for each booking, such as a
        random UUID, and sends again unchanged when it repeats the request.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: ^[!-~]+$
    IfMatch:
      name: If-Match
      in: header
      description: |
        The `ETag` of the reservation as the client read it, such as `"1"`,
        quotes included. The operation needs it, and answers 428 without it
        and 412 when the reservation changed since.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    Limit:
      name: limit
      in: query
      description: The largest number of items in the page.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: The `nextCursor` of the page before. Leave it out for the first page.
      schema:
        type: string
        minLength: 1
        maxLength: 512
  headers:
    Location:
      description: The URL of the reservation.
      required: true
      schema:
        type: string
        format: uri-reference
    ETag:
      description: |
        The version of the reservation, as a strong entity tag such as `"1"`.
        Send it in `If-Match` to change the reservation.
      required: true
      schema:
        type: string
        pattern: ^"[0-9]+"$
  responses:
    Problem:
      description: The request failed. The body says why, as RFC 9457 describes.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unavailable:
      description: The rooms cannot be checked now, because the Facility API does not answer. The body says why, as RFC 9457 describes.
      headers:
        Retry-After:
          description: The number of seconds after which the request may succeed.
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    NewReservation:
      type: object
      description: What is needed to book a room.
      required: [roomId, startsAt, endsAt, attendees, organizerEmail]
      additionalProperties: false
      properties:
        roomId:
          type: string
          format: uuid
          description: The id of the room, as the Facility API knows it.
        startsAt:
          type: string
          format: date-time
          description: When the reservation starts.
          examples: ["2026-11-20T10:00:00+09:00"]
        endsAt:
          type: string
          format: date-time
          description: When the reservation ends. The room is free again from this instant.
          examples: ["2026-11-20T11:00:00+09:00"]
        attendees:
          $ref: "#/components/schemas/Attendees"
        organizerEmail:
          $ref: "#/components/schemas/EmailAddress"
    ReservationChanges:
      type: object
      description: The parts of a reservation to change. A part that is left out keeps its value.
      minProperties: 1
      additionalProperties: false
      properties:
        startsAt:
          type: string
          format: date-time
          description: When the reservation starts.
        endsAt:
          type: string
          format: date-time
          description: When the reservation ends.
        attendees:
          $ref: "#/components/schemas/Attendees"
    Reservation:
      type: object
      description: A reservation of a meeting room.
      required: [id, roomId, startsAt, endsAt, attendees, organizerEmail, status]
      properties:
        id:
          type: string
          format: uuid
          description: The id of the reservation.
        roomId:
          type: string
          format: uuid
          description: The id of the reserved room.
        startsAt:
          type: string
          format: date-time
          description: When the reservation starts.
        endsAt:
          type: string
          format: date-time
          description: When the reservation ends.
        attendees:
          $ref: "#/components/schemas/Attendees"
        organizerEmail:
          $ref: "#/components/schemas/EmailAddress"
        status:
          type: string
          description: Whether the reservation holds the room (`confirmed`) or was cancelled (`cancelled`).
          enum: [confirmed, cancelled]
    ReservationPage:
      type: object
      description: One page of reservations.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: The reservations of this page.
          maxItems: 100
          items:
            $ref: "#/components/schemas/Reservation"
        nextCursor:
          type: [string, "null"]
          description: The cursor of the next page, or null on the last page.
    Attendees:
      type: integer
      format: int32
      description: The number of people who attend, the organizer included.
      minimum: 1
      maximum: 1000
      examples: [4]
    EmailAddress:
      type: string
      description: The email address of the person who organizes the meeting.
      minLength: 3
      maxLength: 254
      pattern: ^[^@\s]+@[^@\s]+$
      examples: [organizer@example.com]
    Problem:
      type: object
      description: A problem, as RFC 9457 describes.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: A URI that identifies the kind of problem and leads to its documentation.
        title:
          type: string
          description: A short summary of the kind of problem. It is the same for every occurrence.
        status:
          type: integer
          format: int32
          description: The HTTP status code.
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: What went wrong in this occurrence.
        instance:
          type: string
          format: uri-reference
          description: A URI that identifies this occurrence.
        errors:
          type: array
          description: The parts of the request that are not valid.
          maxItems: 100
          items:
            $ref: "#/components/schemas/InvalidParam"
    InvalidParam:
      type: object
      description: One part of the request that is not valid.
      required: [pointer, detail]
      properties:
        pointer:
          type: string
          description: A JSON Pointer (RFC 6901) to the part of the request body, or the name of a parameter.
        detail:
          type: string
          description: Why the part is not valid.
