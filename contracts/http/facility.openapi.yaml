# yaml-language-server: $schema=https://spec.openapis.org/oas/3.1/schema/2022-10-07
openapi: 3.1.0
info:
  title: Facility API
  version: 0.1.0
  summary: Meeting rooms and when they can be used.
  description: |
    The Facility context registers meeting rooms and answers what a room can
    hold and when it is open. Other contexts read rooms through this API and
    never through the database.
  license:
    name: MIT No Attribution
    identifier: MIT-0
servers:
  - url: /
    description: The base URL differs by environment, so each client sets it.
# The API is reachable only from the private network and has no
# authentication of its own (TPL-0014).
security: []
tags:
  - name: rooms
    description: Meeting rooms.
paths:
  /rooms:
    post:
      operationId: registerRoom
      summary: Register a room
      description: Registers a meeting room. The name of a room is unique.
      tags: [rooms]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewRoom"
      responses:
        "201":
          description: The room was registered.
          headers:
            Location:
              description: The URL of the new room.
              required: true
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    get:
      operationId: listRooms
      summary: List rooms
      description: Lists rooms in the order of their names, one page at a time.
      tags: [rooms]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of rooms.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomPage"
        "400":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /rooms/{roomId}:
    get:
      operationId: getRoom
      summary: Get a room
      description: Returns one room.
      tags: [rooms]
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: The room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
components:
  parameters:
    RoomId:
      name: roomId
      in: path
      required: true
      description: The id of a room.
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      description: The largest number of items in the page.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: The `nextCursor` of the page before. Leave it out for the first page.
      schema:
        type: string
        minLength: 1
        maxLength: 512
  responses:
    Problem:
      description: The request failed. The body says why, as RFC 9457 describes.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    NewRoom:
      type: object
      description: What is needed to register a room.
      required: [name, capacity, openFrom, openUntil, timeZone]
      additionalProperties: false
      properties:
        name:
          type: string
          description: The name that people use for the room.
          minLength: 1
          maxLength: 100
          examples: [Aoba]
        capacity:
          type: integer
          format: int32
          description: The largest number of people the room holds.
          minimum: 1
          maximum: 1000
          examples: [8]
        openFrom:
          $ref: "#/components/schemas/TimeOfDay"
        openUntil:
          $ref: "#/components/schemas/TimeOfDay"
        timeZone:
          type: string
          description: The IANA time zone in which `openFrom` and `openUntil` are read.
          minLength: 1
          maxLength: 64
          examples: [Asia/Tokyo]
    Room:
      type: object
      description: A meeting room.
      required: [id, name, capacity, openFrom, openUntil, timeZone, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: The id of the room.
        name:
          type: string
          description: The name that people use for the room.
        capacity:
          type: integer
          format: int32
          description: The largest number of people the room holds.
        openFrom:
          $ref: "#/components/schemas/TimeOfDay"
        openUntil:
          $ref: "#/components/schemas/TimeOfDay"
        timeZone:
          type: string
          description: The IANA time zone in which `openFrom` and `openUntil` are read.
        createdAt:
          type: string
          format: date-time
          description: When the room was registered.
    RoomPage:
      type: object
      description: One page of rooms.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: The rooms of this page.
          maxItems: 100
          items:
            $ref: "#/components/schemas/Room"
        nextCursor:
          type: [string, "null"]
          description: The cursor of the next page, or null on the last page.
    TimeOfDay:
      type: string
      description: A time of day in hours and minutes, on a 24-hour clock.
      pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
      examples: ["09:00"]
    Problem:
      type: object
      description: A problem, as RFC 9457 describes.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: A URI that identifies the kind of problem and leads to its documentation.
        title:
          type: string
          description: A short summary of the kind of problem. It is the same for every occurrence.
        status:
          type: integer
          format: int32
          description: The HTTP status code.
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: What went wrong in this occurrence.
        instance:
          type: string
          format: uri-reference
          description: A URI that identifies this occurrence.
        errors:
          type: array
          description: The parts of the request that are not valid.
          maxItems: 100
          items:
            $ref: "#/components/schemas/InvalidParam"
    InvalidParam:
      type: object
      description: One part of the request that is not valid.
      required: [pointer, detail]
      properties:
        pointer:
          type: string
          description: A JSON Pointer (RFC 6901) to the part of the request body, or the name of a parameter.
        detail:
          type: string
          description: Why the part is not valid.
